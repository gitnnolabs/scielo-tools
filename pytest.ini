[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = tests.py test_*.py *_tests.py
pythonpath = .
addopts = --reuse-db
markers =
    llama: integration tests that call local Llama/Ollama for reference marking
filterwarnings =
    ignore:pkg_resources is deprecated as an API:UserWarning:packtools.catalogs
