name: scielo_tools_production

x-django: &django
  image: scielo_tools_production_django
  depends_on:
    - postgres
    - redis
    - ollama
  env_file:
    - ./.envs/.production/.django
    - ./.envs/.production/.postgres

services:
  django:
    <<: *django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      pull: false
    container_name: scielo_tools_production_django
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
      pull: false
    image: scielo_tools_production_postgres
    container_name: scielo_tools_production_postgres
    volumes:
      - production_postgres_data:/var/lib/postgresql
    env_file:
      - ./.envs/.production/.postgres

  redis:
    image: redis:8
    container_name: scielo_tools_production_redis

  ollama:
    image: ollama/ollama:latest
    container_name: scielo_tools_production_ollama
    volumes:
      - production_ollama_data:/root/.ollama

  traefik:
    build:
      context: .
      dockerfile: ./compose/production/traefik/Dockerfile
      pull: false
    image: scielo_tools_production_traefik
    container_name: scielo_tools_production_traefik
    depends_on:
      - django
    volumes:
      - production_traefik:/etc/traefik/acme
    ports:
      - "80:80"
      - "443:443"

  celeryworker:
    <<: *django
    container_name: scielo_tools_production_celeryworker
    depends_on:
      - postgres
      - redis
      - ollama
      - django
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    container_name: scielo_tools_production_celerybeat
    depends_on:
      - postgres
      - redis
      - ollama
      - django
    ports: []
    command: /start-celerybeat

volumes:
  production_postgres_data:
  production_traefik:
  production_ollama_data:
